server {
listen 8080;
server_name _;

root /usr/share/nginx/html;
index index.html;

# Support client-side React routing
location / {
    try_files $uri $uri/ /index.html;
}

# Don't cache the HTML entry point
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Cache fingerprinted Vite assets
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Health check for Docker and Kubernetes
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Block access to hidden files
location ~ /\. {
    deny all;
}

}
